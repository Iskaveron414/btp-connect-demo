
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTP Connect 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#202522}
#scene{width:100vw;height:100vh;display:block}
#header{
position:absolute;top:12px;left:12px;right:12px;
color:white;background:#17251fdd;padding:14px;
border-radius:12px;z-index:2
}
#header strong{font-size:19px;color:#f5a623}
#header small{display:block;margin-top:5px}
#hint{
position:absolute;bottom:18px;left:50%;
transform:translateX(-50%);
background:#17251fdd;color:white;
padding:12px 16px;border-radius:10px;
font-size:12px;text-align:center;width:max-content;
max-width:90%;z-index:2
}
</style>
</head>
<body>

<div id="header">
<strong>BTP CONNECT</strong>
<div>Votre magasin virtuel de matériaux</div>
<small>Prévisualisation du magasin 3D</small>
</div>

<div id="hint">
Fais glisser ton doigt sur l'écran pour regarder autour de toi.
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ba7a3);
scene.fog = new THREE.Fog(0x9ba7a3, 22, 55);

const camera = new THREE.PerspectiveCamera(
65, window.innerWidth/window.innerHeight, 0.1, 100
);
camera.position.set(0, 1.7, 11);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.id="scene";

// Lumières
scene.add(new THREE.HemisphereLight(0xffffff,0x596052,2));

const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(8,15,8);
sun.castShadow=true;
scene.add(sun);

// Matériaux
const concrete = new THREE.MeshStandardMaterial({color:0x858783});
const wallMat = new THREE.MeshStandardMaterial({color:0xd8d1c2});
const dark = new THREE.MeshStandardMaterial({color:0x35423d});
const metal = new THREE.MeshStandardMaterial({color:0x52616a});
const orange = new THREE.MeshStandardMaterial({color:0xe99a31});
const cement = new THREE.MeshStandardMaterial({color:0xc4b99d});
const white = new THREE.MeshStandardMaterial({color:0xe5e0d4});

// Fonction pour créer des blocs
function box(w,h,d,x,y,z,mat){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

// Sol
box(20,0.3,30,0,-0.15,-2,concrete);

// Murs
box(20,6,0.35,0,3,-17,wallMat);
box(0.35,6,30,-10,3,-2,wallMat);
box(0.35,6,30,10,3,-2,wallMat);

// Plafond
box(20,0.3,30,0,6,-2,dark);

// Poutres du toit
for(let z=-15;z<12;z+=5){
 box(20,0.18,0.18,0,5.75,z,metal);
}

// Éclairage du magasin
for(let z=-13;z<9;z+=6){
 const lamp=new THREE.PointLight(0xffe5b5,45,13);
 lamp.position.set(0,5.3,z);
 scene.add(lamp);
 box(2,0.08,0.35,0,5.5,z,white);
}

// Entrée
box(5,0.15,0.5,0,0.08,12.5,orange);

// Étagères
function shelf(x,z){
 box(0.25,3,0.3,x,1.5,z,metal);
 box(0.25,3,0.3,x,1.5,z-3,metal);
 box(3.2,0.18,3.3,x+(x<0?1.6:-1.6),0.8,z-1.5,metal);
 box(3.2,0.18,3.3,x+(x<0?1.6:-1.6),1.8,z-1.5,metal);
 box(3.2,0.18,3.3,x+(x<0?1.6:-1.6),2.8,z-1.5,metal);
}
shelf(-9,-4);
shelf(9,-4);

// Sacs de ciment
function bag(x,y,z,color=cement){
 const m=new THREE.MeshStandardMaterial({color});
 const b=box(0.9,0.45,0.55,x,y,z,m);
 b.rotation.y=Math.random()*0.08;
 return b;
}

// Palettes de ciment
function pallet(x,z){
 box(3,0.2,2,x,0.25,z,orange);
 for(let row=0;row<3;row++){
  for(let i=0;i<3;i++){
   bag(x-0.85+i*0.85,0.58+row*0.46,z);
  }
 }
}
pallet(-7,-11);
pallet(7,-11);
pallet(-7,-5);
pallet(7,-5);

// Barres de fer à béton
function ironBundle(x,z){
 const mat=new THREE.MeshStandardMaterial({
  color:0x687983,metalness:0.75,roughness:0.3
 });
 for(let i=0;i<9;i++){
  const rod=new THREE.Mesh(
   new THREE.CylinderGeometry(0.055,0.055,4,8),mat
  );
  rod.rotation.x=Math.PI/2;
  rod.position.set(x+(i%3)*0.16,0.35+Math.floor(i/3)*0.13,z);
  rod.castShadow=true;
  scene.add(rod);
 }
}
ironBundle(-3,-13);
ironBundle(3,-13);

// Panneaux indicateurs
function sign(text,x,y,z){
 const canvas=document.createElement('canvas');
 canvas.width=512;
 canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#263c32';
 ctx.fillRect(0,0,512,128);
 ctx.fillStyle='#ffffff';
 ctx.font='bold 48px Arial';
 ctx.textAlign='center';
 ctx.fillText(text,256,82);
 const texture=new THREE.CanvasTexture(canvas);
 const material=new THREE.MeshBasicMaterial({
  map:texture,side:THREE.DoubleSide
 });
 const panel=new THREE.Mesh(
  new THREE.PlaneGeometry(4,1),material
 );
 panel.position.set(x,y,z);
 scene.add(panel);
}
sign('RAYON CIMENT',-7,3.6,-3);
sign('RAYON FER',7,3.6,-3);

// Navigation tactile : rotation de la caméra
let dragging=false;
let lastX=0;
let lastY=0;
let angle=0;
let vertical=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 angle-=(e.clientX-lastX)*0.004;
 vertical+=(e.clientY-lastY)*0.003;
 vertical=Math.max(-0.35,Math.min(0.35,vertical));
 lastX=e.clientX;
 lastY=e.clientY;
 camera.rotation.order='YXZ';
 camera.rotation.y=angle;
 camera.rotation.x=vertical;
});

// Affichage
function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
  </html>
